[custom]
;不要随意改变关键字，否则会导致出错
;ACL4SSR 在线版 —— AI / Gemini 定制版（基于 cmliu/ACL4SSR 的 ACL4SSR_Online.ini）
;定制日期 2026-06-12
;改动：
;  1) 原「🤖 OpenAi」组改名为「🤖 AI」（OpenAI / Claude / Copilot / AI 合集 都在此组），出口默认美国
;  2) 新增「✨ Gemini」独立组，出口默认美国，不放香港入口（Gemini/ChatGPT 封锁香港）
;  3) Gemini 规则置于所有 Google 规则与 AI 规则之前，先命中先生效，确保 Gemini 域名优先归入 Gemini 组
;Gemini 覆盖（纯精确域名，零误伤；未用 blackmatrix7 列表以避免 apis.google.com / colab 泛匹配）：
;  gemini.google.com / bard.google.com / aistudio.google.com / makersuite.google.com /
;  generativeai.google / ai.google.dev / notebooklm.google.com / antigravity.google（反重力）/
;  generativelanguage.googleapis.com（Gemini API）/ proactivebackend-pa.googleapis.com（后端）
;出口策略：AI 组与 Gemini 组均为 select，列表首项=🇺🇲 美国节点（默认），可在客户端切到🚀 节点选择/♻️ 自动选择/☑️ 手动切换
;提醒：切到「节点选择/自动选择」时仍可能选中香港节点，届时 Gemini/ChatGPT 会不可用，保持默认美国即可

